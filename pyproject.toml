[project]
name = "gemini-enterprise-agent-platform"
version = "0.1.0"
description = "Gemini Enterprise Agent Platform (Vertex AI Agent Runtime, ADK 2.0, Registry, Sandbox, Skills, Graph Workflow)"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "google-adk[agent-identity,a2a]>=2.12.0",
    "google-cloud-aiplatform[adk,agent_engines,evaluation]>=2.6.0",
    "google-genai",
    "google-auth",
    "a2a-sdk>=0.3.4,<0.4",
    "mcp>=1.27.1",
    "pyyaml>=6.0.3",
    "pydantic",
    "cloudpickle>=3.1.2",
    "python-dotenv>=1.2.2",
    "requests",
    "ipykernel",
    "numpy",
    "pandas",
    "matplotlib",
]

[tool.uv.workspace]
members = ["agents/*"]
